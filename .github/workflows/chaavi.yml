name: Chaavi

# dadi's workflow for this fork: the /v1 interop suite against a real build (the official
# Bitwarden CLI is the oracle), then the image Nas runs. Upstream's build.yml still runs the
# cargo build, tests and clippy; its release and trivy jobs only run in dani-garcia/vaultwarden.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "tools/**"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "tools/**"
      - ".gitattributes"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  interop:
    name: /v1 interop with the Bitwarden CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust from rust-toolchain.toml
        run: rustup show

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: chaavi-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Unit tests (src/dadi)
        run: cargo test --features sqlite "dadi::"

      - name: Build
        run: cargo build --features sqlite

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the Bitwarden CLI
        working-directory: dadi-tests
        run: npm ci --no-audit --no-fund

      - name: Interop suite
        working-directory: dadi-tests
        env:
          BIN: ${{ github.workspace }}/target/debug/vaultwarden
          DIR: /tmp/chaavi-interop
        run: |
          bash serve-local.sh > /tmp/chaavi-interop.log 2>&1 &
          for _ in $(seq 60); do curl -skf https://localhost:8099/health && break; sleep 1; done
          NODE_EXTRA_CA_CERTS=/tmp/chaavi-interop/cert.pem CHAAVI_URL=https://localhost:8099 npm test

      - name: Server log
        if: always()
        run: cat /tmp/chaavi-interop.log || true

  publish:
    name: Publish ghcr.io image
    needs: interop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (upstream Alpine Dockerfile, SQLite only)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/chaavi
          SHA: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile.alpine \
            --build-arg DB=sqlite,enable_mimalloc \
            --build-arg VW_VERSION="chaavi-${SHA::12}" \
            -t "$IMAGE:latest" -t "$IMAGE:$SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
