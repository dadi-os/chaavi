name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: chaavi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build dev image
        run: docker build --target dev -t chaavi-dev .

      - name: Test
        run: |
          docker run --rm --network host \
            -e VAULT_URL=http://127.0.0.1:80 \
            -v "$PWD:/app" -v /app/node_modules \
            chaavi-dev npm test

      - name: Build production image
        run: docker build --target production -t chaavi-prod .

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chaavi:latest
            ghcr.io/${{ github.repository_owner }}/chaavi:${{ github.sha }}
